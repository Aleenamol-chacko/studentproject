<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Payment | Student Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-100 via-sky-50 to-blue-100 flex">

<!-- Background -->
<div class="fixed inset-0 -z-10">
<img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b"
class="w-full h-full object-cover opacity-20">
</div>

<!-- Sidebar -->
<aside class="w-64 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 text-gray-200 p-6 min-h-screen shadow-2xl">

<h2 class="text-2xl font-bold mb-10 bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
Admin Panel
</h2>

<ul class="space-y-6">

<li><a href="{% url 'dashboard' %}" class="hover:text-emerald-400 transition">Dashboard</a></li>
<li><a href="{% url 'student' %}" class="hover:text-emerald-400 transition">Student Management</a></li>
<li><a href="{% url 'faculty' %}" class="hover:text-emerald-400 transition">Faculty Management</a></li>
<li><a href="{% url 'course' %}" class="hover:text-emerald-400 transition">Course Management</a></li>
<li><a href="{% url 'payment' %}" class="text-emerald-400 font-semibold">Payment Management</a></li>

<li class="pt-10 border-t border-gray-600">
<a href="{% url 'logout' %}" class="hover:text-red-400 transition">Logout</a>
</li>

</ul>
</aside>

<!-- Main Content -->
<div class="flex-1 p-6 max-w-full">

<!-- Header -->
<div class="flex items-center mb-8">
<a href="{% url 'payment' %}" class="text-slate-600 hover:text-slate-800 mr-4">
← Back to Payment List
</a>
<h1 class="text-3xl font-bold text-slate-800">Add Payment</h1>
</div>

<!-- Add Payment Form -->
<div class="bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl p-8">

<form method="POST">
{% csrf_token %}

<div class="grid md:grid-cols-2 gap-6">

<div class="space-y-4">
<h3 class="text-lg font-semibold text-slate-800 border-b pb-2">Payment Information</h3>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Student *</label>
<select name="student" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Student</option>
{% for student in students %}
<option value="{{ student.id }}">{{ student.fullname }} ({{ student.studentid|default:"No ID" }})</option>
{% endfor %}
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Amount (₹) *</label>
<input type="number" name="amount" step="0.01" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Payment Type *</label>
<select name="payment_type" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Type</option>
<option value="Tuition Fee">Tuition Fee</option>
<option value="Exam Fee">Exam Fee</option>
<option value="Library Fee">Library Fee</option>
<option value="Hostel Fee">Hostel Fee</option>
<option value="Other">Other</option>
</select>
</div>

</div>

<div class="space-y-4">
<h3 class="text-lg font-semibold text-slate-800 border-b pb-2">Payment Details</h3>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Payment Method *</label>
<select name="payment_method" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Method</option>
<option value="Cash">Cash</option>
<option value="Card">Card</option>
<option value="Online Transfer">Online Transfer</option>
<option value="Cheque">Cheque</option>
<option value="UPI">UPI</option>
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Status *</label>
<select name="status" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Status</option>
<option value="Completed">Completed</option>
<option value="Pending">Pending</option>
<option value="Failed">Failed</option>
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Transaction ID</label>
<input type="text" name="transaction_id"
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

</div>

</div>

<div class="mt-6">
<label class="block text-sm font-medium text-slate-700 mb-2">Description</label>
<textarea name="description" rows="3"
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"></textarea>
</div>

<div class="flex justify-end space-x-4 mt-8">
<a href="{% url 'payment' %}" 
   class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition">
Cancel
</a>
<button type="submit" 
        class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-6 py-3 rounded-lg hover:scale-105 transition">
Add Payment
</button>
</div>

</form>

</div>

</div>

</body>
</html>
