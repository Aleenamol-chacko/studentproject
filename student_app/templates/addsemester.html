<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Semester | Student Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-100 via-sky-50 to-blue-100 flex">

<!-- Background -->
<div class="fixed inset-0 -z-10">
<img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b"
class="w-full h-full object-cover opacity-20">
</div>

<!-- Sidebar -->
<aside class="w-64 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 text-gray-200 p-6 min-h-screen shadow-2xl">

<h2 class="text-2xl font-bold mb-10 bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
Admin Panel
</h2>

<ul class="space-y-6">

<li><a href="{% url 'dashboard' %}" class="hover:text-emerald-400 transition">Dashboard</a></li>
<li><a href="{% url 'student' %}" class="hover:text-emerald-400 transition">Student Management</a></li>
<li><a href="{% url 'faculty' %}" class="hover:text-emerald-400 transition">Faculty Management</a></li>
<li><a href="{% url 'course' %}" class="hover:text-emerald-400 transition">Course Management</a></li>
<li><a href="{% url 'semester' %}" class="text-emerald-400 font-semibold">Semesters</a></li>

<li class="pt-10 border-t border-gray-600">
<a href="{% url 'logout' %}" class="hover:text-red-400 transition">Logout</a>
</li>

</ul>
</aside>

<!-- Main Content -->
<div class="flex-1 p-6 max-w-full">

<!-- Header -->
<div class="flex items-center mb-8">
<a href="{% url 'semester' %}" class="text-slate-600 hover:text-slate-800 mr-4">
← Back to Semesters
</a>
<h1 class="text-3xl font-bold text-slate-800">Add Semester</h1>
</div>

<!-- Add Semester Form -->
<div class="bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl p-8">

<form method="POST" action="{% url 'semester_add' %}">
{% csrf_token %}

<div class="grid md:grid-cols-2 gap-6">

<div class="space-y-4">
<h3 class="text-lg font-semibold text-slate-800 border-b pb-2">Basic Information</h3>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Semester Name *</label>
<input type="text" name="name" placeholder="e.g., Fall 2024, Spring 2025" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Academic Year *</label>
<select name="academic_year" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Academic Year</option>
{% for academic_year in academic_years %}
<option value="{{ academic_year.id }}">{{ academic_year.name }}</option>
{% endfor %}
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Semester Number</label>
<input type="number" name="semester_number" min="1" max="8"
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

</div>

<div class="space-y-4">
<h3 class="text-lg font-semibold text-slate-800 border-b pb-2">Schedule</h3>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Start Date *</label>
<input type="date" name="start_date" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">End Date *</label>
<input type="date" name="end_date" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

<div class="flex items-center">
<input type="checkbox" name="is_active" id="is_active" checked
       class="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500">
<label for="is_active" class="ml-2 text-sm font-medium text-slate-700">Active Semester</label>
</div>

</div>

</div>

<div class="flex justify-end space-x-4 mt-8">
<a href="{% url 'semester' %}" 
   class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition">
Cancel
</a>
<button type="submit" 
        class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white px-6 py-3 rounded-lg hover:scale-105 transition">
Add Semester
</button>
</div>

</form>

</div>

</div>

</body>
</html>
