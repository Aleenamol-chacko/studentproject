<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assign Course</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
    body {
        background: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644') no-repeat center center/cover;
    }
</style>

</head>

<body class="min-h-screen flex items-center justify-center">

<!-- Overlay -->
<div class="absolute inset-0 bg-black bg-opacity-60"></div>

<!-- Card -->
<div class="relative z-10 bg-white/10 backdrop-blur-xl shadow-2xl rounded-2xl p-10 w-full max-w-lg border border-white/20">

    <h2 class="text-3xl font-bold text-white text-center mb-6">
        Assign Course to Faculty
    </h2>

    <form method="POST" class="space-y-5">
        {% csrf_token %}

        <!-- Faculty -->
        <div>
            <label class="block text-white mb-1">Select Faculty</label>
            <select name="faculty" required
                class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30 focus:outline-none">
                
                <option value="">-- Choose Faculty --</option>
                {% for f in faculties %}
                <option value="{{ f.id }}" class="text-black">
                    {{ f.fullname }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Course -->
        <div>
            <label class="block text-white mb-1">Select Course</label>
            <select name="course" required
                class="w-full px-4 py-2 rounded-lg bg-white/20 text-white border border-white/30 focus:outline-none">
                
                <option value="">-- Choose Course --</option>
                {% for c in courses %}
                <option value="{{ c.id }}" class="text-black">
                    {{ c.coursename }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Button -->
        <button type="submit"
            class="w-full py-3 mt-4 bg-gradient-to-r from-teal-400 to-blue-500 text-white font-semibold rounded-lg shadow-lg hover:scale-105 transition duration-300">
             Assign Course
        </button>

    </form>

</div>

</body>
</html>
