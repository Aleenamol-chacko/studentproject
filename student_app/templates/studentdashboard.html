<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-900 via-indigo-900 to-emerald-900 min-h-screen text-white">

<div class="flex">

<!-- Sidebar -->
<aside class="w-64 bg-black/40 backdrop-blur-xl p-6 min-h-screen">
    <h2 class="text-2xl font-bold mb-10 text-blue-300">Student Panel</h2>
    <ul class="space-y-6">
    <li><a href="{% url 'dashboard' %}" class="hover:text-blue-400">Dashboard</a></li>

    <li><a href="{% url 'student_view' 1 %}" class="hover:text-blue-400">Profile</a></li>

    <li><a href="{% url 'course' %}" class="hover:text-blue-400">Courses</a></li>

    <li><a href="{% url 'student' %}" class="hover:text-blue-400">Attendance</a></li>

    <li><a href="{% url 'logout' %}" class="hover:text-red-400">Logout</a></li>
</ul>
</aside>

<!-- Main -->
<main class="flex-1 p-10">

<h1 class="text-4xl font-bold mb-10 text-blue-300">Welcome Student</h1>

<div class="grid md:grid-cols-3 gap-8">

<div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-xl">
<h3 class="text-xl font-bold">Enrolled Courses</h3>
<p class="mt-4 text-3xl text-emerald-300">6</p>
</div>

<div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-xl">
<h3 class="text-xl font-bold">Attendance</h3>
<p class="mt-4 text-3xl text-blue-300">92%</p>
</div>

<div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-xl">
<h3 class="text-xl font-bold">Assignments</h3>
<p class="mt-4 text-3xl text-teal-300">3 Pending</p>
</div>

</div>

</main>
</div>

</body>
</html>
