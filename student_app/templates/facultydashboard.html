<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-900 via-emerald-900 to-blue-900 min-h-screen text-white">

<div class="flex">

<!-- Sidebar -->
<aside class="w-64 bg-black/40 backdrop-blur-xl p-6 min-h-screen">
    <h2 class="text-2xl font-bold mb-10 text-indigo-300">Faculty Panel</h2>
   <ul class="space-y-6">
    <li><a href="{% url 'dashboard' %}" class="hover:text-indigo-400">Dashboard</a></li>

    <li><a href="{% url 'faculty_view' 1 %}" class="hover:text-indigo-400">Profile</a></li>

    <li><a href="{% url 'course' %}" class="hover:text-indigo-400">My Courses</a></li>

    <li><a href="{% url 'student' %}" class="hover:text-indigo-400">Student Details</a></li>

    <li><a href="{% url 'faculty_add' %}" class="hover:text-green-400">➕ Add Faculty</a></li>

    <li><a href="{% url 'logout' %}" class="hover:text-red-400">Logout</a></li>
</ul>
</aside>

<!-- Main -->
<main class="flex-1 p-10">

<h1 class="text-4xl font-bold mb-10 text-indigo-300">Welcome Faculty</h1>

<div class="grid md:grid-cols-3 gap-8">

<div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-xl">
<h3 class="text-xl font-bold">Courses Teaching</h3>
<p class="mt-4 text-3xl text-emerald-300">4</p>
</div>

<div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-xl">
<h3 class="text-xl font-bold">Total Students</h3>
<p class="mt-4 text-3xl text-blue-300">240</p>
</div>

<div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-xl">
<h3 class="text-xl font-bold">Pending Evaluations</h3>
<p class="mt-4 text-3xl text-teal-300">12</p>
</div>

</div>

</main>
</div>

</body>
</html>
