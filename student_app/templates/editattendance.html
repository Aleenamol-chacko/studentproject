<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Attendance | Student Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-slate-100 via-sky-50 to-blue-100 flex">

<!-- Background -->
<div class="fixed inset-0 -z-10">
<img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b"
class="w-full h-full object-cover opacity-20">
</div>

<!-- Sidebar -->
<aside class="w-64 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 text-gray-200 p-6 min-h-screen shadow-2xl">

<h2 class="text-2xl font-bold mb-10 bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">
Admin Panel
</h2>

<ul class="space-y-6">

<li><a href="{% url 'dashboard' %}" class="hover:text-emerald-400 transition">Dashboard</a></li>
<li><a href="{% url 'student' %}" class="hover:text-emerald-400 transition">Student Management</a></li>
<li><a href="{% url 'faculty' %}" class="hover:text-emerald-400 transition">Faculty Management</a></li>
<li><a href="{% url 'course' %}" class="hover:text-emerald-400 transition">Course Management</a></li>
<li><a href="{% url 'attendance' %}" class="text-emerald-400 font-semibold">Attendance Management</a></li>

<li class="pt-10 border-t border-gray-600">
<a href="{% url 'logout' %}" class="hover:text-red-400 transition">Logout</a>
</li>

</ul>
</aside>

<!-- Main Content -->
<div class="flex-1 p-6 max-w-full">

<!-- Header -->
<div class="flex items-center mb-8">
<a href="{% url 'attendance' %}" class="text-slate-600 hover:text-slate-800 mr-4">
← Back to Attendance List
</a>
<h1 class="text-3xl font-bold text-slate-800">Edit Attendance</h1>
</div>

<!-- Edit Attendance Form -->
<div class="bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl p-8">

<form method="POST">
{% csrf_token %}

<div class="grid md:grid-cols-2 gap-6">

<div class="space-y-4">
<h3 class="text-lg font-semibold text-slate-800 border-b pb-2">Student Information</h3>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Student *</label>
<select name="student" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Student</option>
{% for student in students %}
<option value="{{ student.id }}" {% if attendance.student.id == student.id %}selected{% endif %}>
{{ student.fullname }} ({{ student.studentid|default:"No ID" }})
</option>
{% endfor %}
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Course *</label>
<select name="course" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Course</option>
{% for course in courses %}
<option value="{{ course.id }}" {% if attendance.course.id == course.id %}selected{% endif %}>
{{ course.coursename }}
</option>
{% endfor %}
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Date *</label>
<input type="date" name="date" value="{{ attendance.date|date:'Y-m-d' }}" required
       class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
</div>

</div>

<div class="space-y-4">
<h3 class="text-lg font-semibold text-slate-800 border-b pb-2">Attendance Details</h3>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Status *</label>
<select name="status" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Status</option>
<option value="Present" {% if attendance.status == 'Present' %}selected{% endif %}>Present</option>
<option value="Absent" {% if attendance.status == 'Absent' %}selected{% endif %}>Absent</option>
<option value="Late" {% if attendance.status == 'Late' %}selected{% endif %}>Late</option>
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Marked By *</label>
<select name="marked_by" required
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Faculty</option>
{% for faculty in faculties %}
<option value="{{ faculty.id }}" {% if attendance.marked_by.id == faculty.id %}selected{% endif %}>
{{ faculty.fullname }}
</option>
{% endfor %}
</select>
</div>

<div>
<label class="block text-sm font-medium text-slate-700 mb-2">Semester</label>
<select name="semester"
        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<option value="">Select Semester</option>
{% for semester in semesters %}
<option value="{{ semester.id }}" {% if attendance.semester.id == semester.id %}selected{% endif %}>
{{ semester.name }}
</option>
{% endfor %}
</select>
</div>

</div>

</div>

<div class="flex justify-end space-x-4 mt-8">
<a href="{% url 'attendance' %}" 
   class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition">
Cancel
</a>
<button type="submit" 
        class="bg-gradient-to-r from-amber-500 to-orange-600 text-white px-6 py-3 rounded-lg hover:scale-105 transition">
Update Attendance
</button>
</div>

</form>

</div>

</div>

</body>
</html>
