<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Faculty | College ERP</title>
<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#10B981',
        secondary: '#4F46E5'
      }
    }
  }
}
</script>
</head>

<body class="min-h-screen bg-gradient-to-br from-emerald-100 via-indigo-100 to-cyan-100">

<div class="fixed inset-0 -z-10">
  <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644"
       class="w-full h-full object-cover opacity-20">
</div>

<div class="min-h-screen flex items-center justify-center p-6">

<div class="w-full max-w-5xl bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl p-10">

<div class="text-center mb-10">
  <h1 class="text-4xl font-extrabold text-secondary mb-3">Edit Faculty</h1>
  <p class="text-gray-600">Update faculty personal and professional details</p>
</div>

<form method="POST" action="{% url 'faculty_edit' faculty.id %}" enctype="multipart/form-data" class="space-y-8">
{% csrf_token %}

<!-- Personal Information -->
<div>
<h2 class="text-2xl font-bold text-primary mb-6 border-b pb-2">Personal Information</h2>

<div class="grid md:grid-cols-3 gap-6">

<div>
<label class="block text-sm font-medium mb-1">Full Name *</label>
<input type="text" name="fullname" required value="{{ faculty.fullname }}"
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Date of Birth *</label>
<input type="date" name="dob" value="{{ faculty.dob|date:'Y-m-d' }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Gender *</label>
<select name="gender" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
<option value="Male" {% if faculty.gender == "Male" %}selected{% endif %}>Male</option>
<option value="Female" {% if faculty.gender == "Female" %}selected{% endif %}>Female</option>
<option value="Other" {% if faculty.gender == "Other" %}selected{% endif %}>Other</option>
</select>
</div>

<div>
<label class="block text-sm font-medium mb-1">Email *</label>
<input type="email" name="email" value="{{ faculty.email }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Phone *</label>
<input type="tel" name="phone" value="{{ faculty.phone }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

</div>
</div>

<!-- Professional Information -->
<div>
<h2 class="text-2xl font-bold text-primary mb-6 border-b pb-2">Professional Information</h2>

<div class="grid md:grid-cols-3 gap-6">

<div>
<label class="block text-sm font-medium mb-1">Faculty ID *</label>
<input type="text" name="facultyid" value="{{ faculty.facultyid }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Department *</label>
<select name="department" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
<option value="Computer Science" {% if faculty.department == "Computer Science" %}selected{% endif %}>Computer Science</option>
<option value="Electronics" {% if faculty.department == "Electronics" %}selected{% endif %}>Electronics</option>
<option value="Mechanical" {% if faculty.department == "Mechanical" %}selected{% endif %}>Mechanical</option>
<option value="Commerce" {% if faculty.department == "Commerce" %}selected{% endif %}>Commerce</option>
<option value="Management" {% if faculty.department == "Management" %}selected{% endif %}>Management</option>
</select>
</div>

<div>
<label class="block text-sm font-medium mb-1">Designation *</label>
<input type="text" name="designation" value="{{ faculty.designation }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Joining Date *</label>
<input type="date" name="joining_date" value="{{ faculty.joining_date|date:'Y-m-d' }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Qualification *</label>
<input type="text" name="qualification" value="{{ faculty.qualification }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

<div>
<label class="block text-sm font-medium mb-1">Experience (Years)</label>
<input type="number" name="experience" value="{{ faculty.experience }}"
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

</div>
</div>

<!-- Address -->
<div>
<h2 class="text-2xl font-bold text-primary mb-6 border-b pb-2">Address Details</h2>

<div class="grid md:grid-cols-2 gap-6">

<div>
<label class="block text-sm font-medium mb-1">Address *</label>
<textarea name="address" rows="3" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">{{ faculty.address }}</textarea>
</div>

<div>
<label class="block text-sm font-medium mb-1">City / State *</label>
<input type="text" name="city" value="{{ faculty.city }}" required
class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-primary outline-none">
</div>

</div>
</div>

<!-- Documents -->
<div>
<h2 class="text-2xl font-bold text-primary mb-6 border-b pb-2">Upload Documents</h2>

<div class="grid md:grid-cols-2 gap-6">

<div>
<label class="block text-sm font-medium mb-1">Faculty Photo</label>
{% if faculty.photo %}
<img src="{{ faculty.photo.url }}" class="w-24 h-24 rounded mb-2">
{% endif %}

<input type="file" name="photo" accept="image/*"
class="w-full border rounded-xl p-3 bg-white">
</div>

<div>
<label class="block text-sm font-medium mb-1">ID Proof</label>

{% if faculty.id_proof %}
<a href="{{ faculty.id_proof.url }}" target="_blank" class="text-blue-600 underline">
View Current Document
</a>
{% endif %}

<input type="file" name="id_proof" accept=".pdf"
class="w-full border rounded-xl p-3 bg-white">
</div>

</div>
</div>

<!-- Buttons -->
<div class="flex justify-center space-x-6 pt-6">

<button type="reset"
class="px-8 py-3 bg-gray-300 rounded-xl hover:bg-gray-400 transition">
Reset
</button>

<button type="submit"
class="px-10 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-xl shadow-lg hover:scale-105 transition">
Update Faculty
</button>

</div>

</form>

</div>
</div>

</body>
</html>
